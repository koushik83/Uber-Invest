name: Scrape 13F Filings

on:
  schedule:
    # Every 3 days at 04:00 UTC. 13F filings are quarterly; only the days
    # around the Feb/May/Aug/Nov 15th deadlines actually produce new data,
    # so a 3-day cadence still catches everything within ~3 days of filing
    # while cutting our SEC load to ~1/3 of the daily schedule.
    # Manual trigger remains available via workflow_dispatch.
    - cron: '0 4 */3 * *'
  workflow_dispatch:
    inputs:
      test_whatsapp:
        description: 'Send a WhatsApp test ping'
        type: boolean
        default: false

jobs:
  # --------------------------------------------------------------------------
  # 1. Scrape SEC EDGAR and commit any new data
  # --------------------------------------------------------------------------
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the data commit
    outputs:
      new_files: ${{ steps.commit.outputs.new_files }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git push works cleanly

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests lxml

      - name: Verify CONTACT_EMAIL secret is set
        # Fail loudly if the secret is empty, before any SEC requests go out.
        # Avoids the bare "SuperinvestorTracker/1.0 " UA that gets throttled.
        run: |
          if [ -z "${{ secrets.CONTACT_EMAIL }}" ]; then
            echo "::error::CONTACT_EMAIL secret is not set. Aborting before SEC requests."
            exit 1
          fi
          echo "CONTACT_EMAIL secret present (length OK)."

      - name: Run scraper (incremental — skips quarters already on disk)
        run: python scraper/main.py
        env:
          SEC_USER_AGENT: "SuperinvestorTracker/1.0 ${{ secrets.CONTACT_EMAIL }}"
          # Slower delay on shared CI runners. Local dev stays at 0.15s default.
          SEC_DELAY: "0.5"

      - name: Commit updated data if anything changed
        id: commit
        # If the scrape takes a few minutes and the remote main advances in
        # the meantime (e.g. another workflow pushes), a plain `git push`
        # is rejected as non-fast-forward. Pulling with rebase before push
        # lets the data commit replay cleanly on top of any new remote state.
        run: |
          git config user.name  "13F Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes -- nothing to commit."
            exit 0
          fi
          # Newly added quarter files -> WhatsApp digest in the deploy job
          echo "new_files=$(git diff --cached --name-only --diff-filter=A -- data/holdings | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          git commit -m "Update holdings $(date -u +%Y-%m-%d_%H:%M)"
          git pull --rebase origin main
          git push origin main

  # --------------------------------------------------------------------------
  # Keepalive: GitHub disables scheduled workflows after 60 days without repo
  # activity. The gap between 13F seasons (mid-Aug -> mid-Nov) exceeds that,
  # so this workflow got auto-disabled on 2026-10-16 and missed Q3 filings.
  # Re-enabling via the API on every run resets the inactivity timer without
  # creating noise commits.
  # --------------------------------------------------------------------------
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Reset 60-day inactivity timer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scrape.yml/enable"

  # --------------------------------------------------------------------------
  # 2. Build React frontend and deploy to GitHub Pages
  # --------------------------------------------------------------------------
  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed by peaceiris/actions-gh-pages

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # pick up any commit made by the scrape job above

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests lxml

      - name: Regenerate dashboard JSONs from raw holdings
        # data/frontend/*.json is gitignored (derivative data). Rebuild it
        # from the committed data/holdings/ tree before bundling the frontend.
        run: python scraper/main.py --export-only

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Copy data JSON into build output
        run: |
          mkdir -p frontend/dist/data
          cp data/frontend/*.json frontend/dist/data/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist

      - name: WhatsApp digest of new filings
        # Runs after deploy so the link in the message shows the new data.
        # notify.py never exits non-zero; skips quietly if secrets are unset.
        if: needs.scrape.outputs.new_files != '' || inputs.test_whatsapp
        run: python scraper/notify.py ${{ inputs.test_whatsapp && '--test' || '' }}
        env:
          NEW_FILES: ${{ needs.scrape.outputs.new_files }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          PYTHONIOENCODING: utf-8
